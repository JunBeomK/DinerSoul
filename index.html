<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 동네 맛집 찾기</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>내 동네 맛집 찾기</h1>

    <div class="location-search">
      <input
        type="text"
        id="location-input"
        placeholder="지역/장소 검색 (예: 안동시, 강남역)"
        autocomplete="off"
      />
      <button id="btn-location-search">검색</button>

      <div id="location-dropdown" class="location-dropdown hidden">
        <button id="btn-use-my-location" class="dropdown-item">
          📍 현재 위치로 검색
        </button>
        <p class="dropdown-label">최근 검색</p>
        <div id="recent-searches-list"></div>
      </div>
    </div>

    <div class="category-buttons">
      <button id="btn-restaurant">맛집</button>
      <button id="btn-cafe">카페</button>
      <button id="btn-convenience">편의점</button>
      <button id="btn-bar">술집</button>
      <button id="btn-favorites">❤ 즐겨찾기</button>

      <select id="radius-select" aria-label="검색 반경">
        <option value="500">500m</option>
        <option value="1000" selected>1km</option>
        <option value="1500">1.5km</option>
      </select>
    </div>

    <div class="map-wrapper">
      <div id="map"></div>
      <button id="btn-research-area" class="research-btn hidden">
        이 지역 재검색
      </button>
    </div>

    <div id="place-detail" class="place-detail hidden">
      <button id="btn-close-detail" class="close-btn" aria-label="닫기">
        ×
      </button>
      <div id="place-detail-body"></div>
    </div>

    <p id="loading-indicator" class="hidden">검색 중...</p>

    <ul id="place-list"></ul>

    <!-- ⚠️ YOUR_JS_KEY_HERE 부분을 카카오 개발자 사이트에서 발급받은 JavaScript 키로 바꿔주세요 -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1bdc3873f38c11e461e3c3639480f83e&libraries=services"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/location-search.js"></script>
    <script src="js/favorites.js"></script>
  </body>
</html>
